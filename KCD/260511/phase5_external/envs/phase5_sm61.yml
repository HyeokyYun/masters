name: phase5
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pyarrow
  - matplotlib
  - jupyter
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.3.1+cu118
      - torchvision==0.18.1+cu118
      # transformers stack — needed by TimesFM / Chronos / Moirai
      - transformers==4.44.2
      - accelerate==0.34.2
      - safetensors>=0.4.5
      - sentencepiece
      - protobuf
      # foundation models
      - timesfm==1.2.0
      - chronos-forecasting==1.4.1
      - uni2ts==1.2.0
      # neuralforecast (Nixtla) for stock SOTA replication
      - neuralforecast==1.7.5
      - utilsforecast
      # parameter-efficient finetuning
      - peft==0.13.0
      # analysis
      - shap==0.46.0
      - lightgbm==4.6.0
      - xgboost==3.1.3
      # misc
      - einops
      - huggingface_hub
